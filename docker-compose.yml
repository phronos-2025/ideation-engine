# Local development database: Postgres 16 with pgvector preinstalled.
# This mirrors Neon (Postgres 16 + pgvector) for a fast local loop; production
# uses Neon. Bring up with: docker compose up -d
#
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/phronos
#
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: phronos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phronos
    ports:
      - '5432:5432'
    volumes:
      - phronos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d phronos']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  phronos_pgdata:
